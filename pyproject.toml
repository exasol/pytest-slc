[project]
name = "pytest-exasol-slc"
version = "1.1.1"
description = ""
authors = [{ name = "Mikhail Beck", email = "mikhail.beck@exasol.com" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pytest>=9,<10",
    "pytest-exasol-backend>=1.1, <2",
    "pytest-exasol-extension>=1.1.0, <2",
    "exasol-python-extension-common[slc-tool] (>=1.0.0, <2)",
    "exasol-saas-api>=2.10.0,<3",
    "pyexasol (>=2.3.0,<3.0.0)",
]

[project.entry-points.pytest11]
slc = "exasol.pytest_slc"

[dependency-groups]
dev = [
    "exasol-toolbox>=10.4.0,<11",
    "exasol-bucketfs>=1.1.0",
]

[tool.poetry]
requires-poetry = ">=2.3.0"
packages = [{include = "exasol"}]

[build-system]
requires = ["poetry_core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
relative_files = true
source = [
    "exasol",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.coverage.report]
fail_under = 15

[tool.black]
line-length = 88
verbose = false
include = "\\.pyi?$"
target_version = ["py310"]

[tool.isort]
profile = "black"
force_grid_wrap = 2

[tool.pylint.master]
fail-under = 6.1
output-format = "colorized,json:.lint.json,text:.lint.txt"

[tool.pylint.format]
max-line-length = 88
max-module-lines = 800

[tool.ruff.lint]
extend-ignore = [
    "E",  # Syntax errors
    "F",  # Pyflakes rules (excluding F401)
    "UP", # pyupgrade rules
    "D",  # Docstring rules
]
extend-select = ["F401"]
unfixable = []


[tool.pytest.ini_options]
markers = [
    "pytester: marks tests using pytester (deselect with '-m \"not pytester\"')",
]

[tool.sonar]
projectKey = "com.exasol:pytest-slc"
host.url = "https://sonarcloud.io"
organization = "exasol"
