name: SAAS-SLC

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-matrix:
    name: Build Matrix
    uses: ./.github/workflows/matrix.yml
    with:
      matrix_keys_json: '["python_versions"]'
    permissions:
      contents: read

  approve-run-saas-tests:
    name: Approve Running SAAS SLC Tests?
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    environment: manual-approval
    steps:
      - name: Tests
        run: echo "SAAS SLC tests approved"

  run-saas-tests:
    name: Run SAAS SLC Tests (Python-${{ matrix.python_versions }})
    needs:
      - build-matrix
      - approve-run-saas-tests
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python & Poetry Environment
        id: set-up-python-and-poetry-environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: ${{ matrix.python_versions }}
          poetry-version: "2.3.0"

      - name: Allow unprivileged user namespaces
        id: allow-unprivileged-user-namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run SAAS SLC Tests
        id: run-saas-tests
        run: >
          poetry run -- nox -s test:integration -- --coverage
          --db-version "${MATRIX_EXASOL_VERSION}"
          -k test_pytest_slc_saas
        env:
          SAAS_HOST: ${{ secrets.INTEGRATION_TEAM_SAAS_STAGING_HOST }}
          SAAS_ACCOUNT_ID: ${{ secrets.INTEGRATION_TEAM_SAAS_STAGING_ACCOUNT_ID }}
          SAAS_PAT: ${{ secrets.INTEGRATION_TEAM_SAAS_STAGING_PAT }}

      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python${{ matrix.python_versions }}-saas-slc
          path: .coverage
          include-hidden-files: true
